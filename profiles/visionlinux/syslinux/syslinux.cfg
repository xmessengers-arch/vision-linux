# Path to the credits file
# Note: syslinux.cfg does not support template identifiers, only syslinux/*.cfg files do.
# However, since we have only one file, we can use it directly.

DEFAULT linux
TIMEOUT 5
MENU TITLE Vision Linux

LABEL linux
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-lts
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-lts.img
    APPEND archisobasedir=%INSTALL_DIR% archisolation=%ARCHISO_LABEL%
    MENU LABEL Boot Vision Linux (x86_64)
    TEXT HELP
    Boot into Vision Linux live environment.
    USB-only Linux distribution with terminal-first interface.
    ENDTEXT

LABEL linux-nomodeset
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-lts
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-lts.img
    APPEND archisobasedir=%INSTALL_DIR% archisolation=%ARCHISO_LABEL% nomodeset
    MENU LABEL Boot Vision Linux (nomodeset)
    TEXT HELP
    Boot with nomodeset for compatibility.
    ENDTEXT

LABEL linux-copyram
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-lts
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-lts.img
    APPEND archisobasedir=%INSTALL_DIR% archisolation=%ARCHISO_LABEL% copytoram
    MENU LABEL Boot Vision Linux (copy to RAM)
    TEXT HELP
    Copy the entire image to RAM before booting.
    ENDTEXT
