name: Build Vision Linux ISO

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: pacman -Syu --noconfirm && pacman -S --noconfirm archiso python python-cryptography git

      - name: Generate keys
        run: python3 keys/generate-keys.py --out-dir keys

      - name: Prepare rootfs
        run: |
          A=profiles/visionlinux/airootfs
          mkdir -p $A/usr/local/bin $A/opt/visionlinux/nickman $A/opt/visionlinux/setup $A/etc/visionlinux/keys $A/etc/init.d $A/root
          cp bin/open bin/vision-shell bin/nock bin/timeQmi bin/wi-fi $A/usr/local/bin/
          chmod +x $A/usr/local/bin/*
          cp nickman/*.py $A/opt/visionlinux/nickman/
          cp setup/vision-setup.py $A/opt/visionlinux/setup/
          cp keys/*.pub $A/etc/visionlinux/keys/
          cp rootfs/etc/init.d/vision-init $A/etc/init.d/
          chmod +x profiles/visionlinux/customize_airootfs.sh
          cp profiles/visionlinux/customize_airootfs.sh $A/root/

      - name: Debug archiso
        run: |
          echo "=== mkarchiso location ==="
          command -v mkarchiso
          echo "=== mkarchiso script head ==="
          head -50 "$(command -v mkarchiso)"
          echo "=== profile ls ==="
          ls -la profiles/visionlinux/
          echo "=== profiledef ==="
          cat profiles/visionlinux/profiledef.sh
          echo "=== pwd ==="
          pwd

      - name: Build ISO
        run: mkarchiso -v -w work -o build profiles/visionlinux

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: vision-linux-iso
          path: build/*.iso
          retention-days: 30
          if-no-files-found: error
